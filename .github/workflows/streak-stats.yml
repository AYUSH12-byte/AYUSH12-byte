name: Update GitHub Streak

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate streak SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from datetime import date, timedelta

          query = '''query($login:String!){user(login:$login){contributionsCollection{contributionCalendar{weeks{contributionDays{date contributionCount}}}}}}'''
          payload = json.dumps({"query": query, "variables": {"login": os.environ["USERNAME"]}})
          result = subprocess.check_output([
              "curl", "-s", "-H", f"Authorization: bearer {os.environ['GH_TOKEN']}",
              "-H", "Content-Type: application/json", "-d", payload,
              "https://api.github.com/graphql"
          ])
          data = json.loads(result)
          days = [d for w in data["data"]["user"]["contributionsCollection"]["contributionCalendar"]["weeks"] for d in w["contributionDays"]]
          counts = {d["date"]: d["contributionCount"] for d in days}

          current = date.today()
          if counts.get(str(current), 0) == 0:
              current -= timedelta(days=1)
          streak = 0
          while counts.get(str(current), 0) > 0:
              streak += 1
              current -= timedelta(days=1)

          longest = 0
          run = 0
          for d in sorted(counts):
              if counts[d] > 0:
                  run += 1
                  longest = max(longest, run)
              else:
                  run = 0

          os.makedirs("profile", exist_ok=True)
          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195"><rect width="495" height="195" rx="12" fill="#1a1b27"/><text x="28" y="42" fill="#70a5fd" font-family="Arial,sans-serif" font-size="22" font-weight="700">GitHub Streak</text><text x="28" y="82" fill="#ffffff" font-family="Arial,sans-serif" font-size="36" font-weight="700">{streak} days</text><text x="28" y="112" fill="#a9b1d6" font-family="Arial,sans-serif" font-size="15">Current streak</text><text x="270" y="82" fill="#ffffff" font-family="Arial,sans-serif" font-size="36" font-weight="700">{longest} days</text><text x="270" y="112" fill="#a9b1d6" font-family="Arial,sans-serif" font-size="15">Longest streak</text><text x="28" y="155" fill="#7aa2f7" font-family="Arial,sans-serif" font-size="14">Keep coding. Keep contributing.</text></svg>'''
          open("profile/streak.svg", "w", encoding="utf-8").write(svg)
          PY

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "Update GitHub streak stats" || exit 0
          git push
