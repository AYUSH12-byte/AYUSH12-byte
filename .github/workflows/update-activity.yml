name: Update GitHub Activity

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate contribution activity SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: AYUSH12-byte
        run: |
          python - <<'PY'
          import json, os, subprocess
          from datetime import date, timedelta

          query = '''
          query($login:String!){
            user(login:$login){
              contributionsCollection{
                contributionCalendar{
                  totalContributions
                  weeks{
                    contributionDays{date contributionCount}
                  }
                }
              }
            }
          }
          '''

          payload = json.dumps({
              "query": query,
              "variables": {"login": os.environ["USERNAME"]}
          })

          result = subprocess.check_output([
              "curl", "-s",
              "-H", f"Authorization: bearer {os.environ['GH_TOKEN']}",
              "-H", "Content-Type: application/json",
              "-d", payload,
              "https://api.github.com/graphql"
          ])

          data = json.loads(result)
          calendar = data["data"]["user"]["contributionsCollection"]["contributionCalendar"]
          days = [
              d
              for week in calendar["weeks"]
              for d in week["contributionDays"]
          ]

          total = calendar["totalContributions"]
          recent = days[-182:]
          max_count = max((d["contributionCount"] for d in recent), default=1)

          width = 900
          height = 330
          left = 55
          top = 75
          cell = 15
          gap = 3
          columns = 26

          rects = []
          for i, d in enumerate(recent):
              x = left + (i // 7) * (cell + gap)
              y = top + (i % 7) * (cell + gap)
              count = d["contributionCount"]
              if count == 0:
                  opacity = 0.12
              else:
                  opacity = 0.25 + 0.75 * (count / max_count)
              rects.append(
                  f'<rect x="{x}" y="{y}" width="{cell}" height="{cell}" rx="3" fill="#70a5fd" opacity="{opacity:.2f}"><title>{d["date"]}: {count} contributions</title></rect>'
              )

          months = []
          last_month = None
          for i, d in enumerate(recent):
              if d["date"][8:] == "01" or d["date"][:7] != last_month:
                  x = left + (i // 7) * (cell + gap)
                  months.append(f'<text x="{x}" y="55" fill="#a9b1d6" font-family="Arial,sans-serif" font-size="12">{d["date"][:7]}</text>')
                  last_month = d["date"][:7]

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="{width}" height="{height}" viewBox="0 0 {width} {height}">
          <rect width="100%" height="100%" rx="14" fill="#1a1b27"/>
          <text x="30" y="32" fill="#ffffff" font-family="Arial,sans-serif" font-size="20" font-weight="700">GitHub Activity</text>
          <text x="30" y="52" fill="#a9b1d6" font-family="Arial,sans-serif" font-size="13">{total} contributions in the last year</text>
          {''.join(months)}
          {''.join(rects)}
          <text x="55" y="205" fill="#a9b1d6" font-family="Arial,sans-serif" font-size="11">Less</text>
          <rect x="88" y="196" width="15" height="15" rx="3" fill="#70a5fd" opacity="0.12"/>
          <rect x="109" y="196" width="15" height="15" rx="3" fill="#70a5fd" opacity="0.35"/>
          <rect x="130" y="196" width="15" height="15" rx="3" fill="#70a5fd" opacity="0.6"/>
          <rect x="151" y="196" width="15" height="15" rx="3" fill="#70a5fd" opacity="0.9"/>
          <text x="174" y="207" fill="#a9b1d6" font-family="Arial,sans-serif" font-size="11">More</text>
          </svg>'''

          os.makedirs("profile", exist_ok=True)
          with open("profile/activity.svg", "w", encoding="utf-8") as f:
              f.write(svg)
          PY

      - name: Commit activity graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/activity.svg
          git commit -m "Update GitHub activity graph" || exit 0
          git push
